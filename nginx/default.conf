server {
	listen 8080;
	server_name _;
	server_tokens off;

	root /usr/share/nginx/html;
	index index.html;

	include /etc/nginx/operation-security-headers.conf;

	location = /index.html {
		include /etc/nginx/operation-security-headers.conf;
		add_header Cache-Control "no-cache" always;
		try_files $uri =404;
	}

	location = /release.json {
		include /etc/nginx/operation-security-headers.conf;
		default_type application/json;
		add_header Cache-Control "no-store" always;
		try_files $uri =404;
	}

	location ^~ /assets/ {
		include /etc/nginx/operation-security-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	# The host reverse proxy owns /api. Never serve the SPA for a missing API route.
	location = /api {
		return 404;
	}

	location ^~ /api/ {
		return 404;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
