name: Post-deploy verification

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full deployed source commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.0

      - name: Install security-patched npm
        run: npm install --global npm@12.2.1

      - name: Verify public source identity and security boundary
        run: npm run verify:public -- https://operationopportunity.jacobdanderson.net "${{ inputs.expected_commit }}"
