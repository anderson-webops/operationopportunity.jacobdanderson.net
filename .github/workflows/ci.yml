name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:8.0.32@sha256:d0d926f94df099bff534b7ee5b5986458131a22489dfff8664509af0c1e2ca9c
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.0
          cache: npm

      - name: Install security-patched npm
        run: npm install --global npm@12.2.1

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v26.13.0"
          test "$(npm --version)" = "12.2.1"

      - name: Install dependencies
        run: npm ci

      - name: Deployment verification
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/operation_security_test_ci
        run: npm run verify:deploy

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.0
          cache: npm

      - name: Install security-patched npm
        run: npm install --global npm@12.2.1

      - run: npm ci
      - run: npm run a11y

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.0
          cache: npm

      - name: Install security-patched npm
        run: npm install --global npm@12.2.1

      - run: npm ci
      - run: npm run -w front-end build

      - uses: cypress-io/github-action@4ce68f262a3888d22cf3175d62010a145ba737ee # v7.4.8
        with:
          install: false
          working-directory: front-end
          config-file: cypress.config.ts
          start: npm run preview -- --host 127.0.0.1 --port 3333
          wait-on: http://127.0.0.1:3333
