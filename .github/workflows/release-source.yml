name: Validate direct production release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

concurrency:
  group: operation-opportunity-production-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      mongodb:
        image: mongo:8.0.28@sha256:5351bff2b5d1563e3fa603a74b9be85ef9323e10aeb0b45cea933a93876e77fd
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.1
          cache: npm

      - name: Verify annotated source release
        id: release
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.1"
          test "$(npm --version)" = "12.0.2"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag"
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{}")" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run direct release gates
        env:
          OPPORTUNITY_COMMIT_SHA: ${{ steps.release.outputs.revision }}
          OPPORTUNITY_DEPLOYED_AT: "2026-08-02T00:00:00Z"
          SOURCE_REVISION: ${{ steps.release.outputs.revision }}
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/operation_security_test_release
        run: |
          npm ci --include=optional --strict-allow-scripts
          npm run verify:deploy
          npm run a11y
          git diff --check

      - name: Record direct deployment contract
        run: |
          {
            echo "### Operation Opportunity direct release"
            echo
            echo "- Release: \`${GITHUB_REF_NAME}\`"
            echo "- Revision: \`${{ steps.release.outputs.revision }}\`"
            echo "- Deployment: atomic host systemd/Nginx promotion"
          } >> "$GITHUB_STEP_SUMMARY"
