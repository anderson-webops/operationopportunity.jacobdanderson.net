# Drop-in static edge locations for Operation Opportunity.
#
# Include this file inside the public HTTPS server block after its root and
# index directives. Replace any existing broad `location /` block instead of
# keeping both. The API location drop-in must be included in the same server:
#
#   root /srv/operation-opportunity/current/front-end/dist;
#   index index.html;
#   include /srv/operation-opportunity/current/deploy/nginx/operation-opportunity-api.location.conf;
#   include /srv/operation-opportunity/current/deploy/nginx/operation-opportunity-static.locations.conf;
#
# Nginx stops inheriting parent add_header directives as soon as a location
# defines one of its own. Each cache-controlled location therefore repeats the
# complete reviewed security policy.

location = /index.html {
	try_files /index.html =404;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.jacobdanderson.net/script.js; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://analytics.jacobdanderson.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header Cross-Origin-Resource-Policy "same-origin" always;
	add_header Cache-Control "no-cache" always;
}

location = /release.json {
	default_type application/json;
	try_files /release.json =404;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.jacobdanderson.net/script.js; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://analytics.jacobdanderson.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header Cross-Origin-Resource-Policy "same-origin" always;
	add_header Cache-Control "no-store" always;
}

location ^~ /assets/ {
	try_files $uri =404;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.jacobdanderson.net/script.js; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://analytics.jacobdanderson.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header Cross-Origin-Resource-Policy "same-origin" always;
	add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location / {
	try_files $uri $uri/ /index.html;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.jacobdanderson.net/script.js; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://analytics.jacobdanderson.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header Cross-Origin-Resource-Policy "same-origin" always;
	add_header Cache-Control "no-cache" always;
}
