# Include inside the TLS server block for operationopportunity.jacobdanderson.net.
location = /api {
	return 404;
}

# Diagnostics are loopback-only even when the API-side key gate is enabled.
location = /api/_dbinfo {
	return 404;
}

location ^~ /api/ {
	client_max_body_size 64k;
	proxy_http_version 1.1;
	proxy_pass http://127.0.0.1:3002/;
	proxy_connect_timeout 3s;
	proxy_send_timeout 15s;
	proxy_read_timeout 15s;
	proxy_next_upstream off;

	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Internal-Diagnostics-Key "";
	proxy_set_header Connection "";
	proxy_hide_header Server;
	proxy_hide_header Content-Security-Policy;
	proxy_hide_header Cross-Origin-Opener-Policy;
	proxy_hide_header Cross-Origin-Resource-Policy;
	proxy_hide_header Permissions-Policy;
	proxy_hide_header Referrer-Policy;
	proxy_hide_header Strict-Transport-Security;
	proxy_hide_header X-Content-Type-Options;
	proxy_hide_header X-Frame-Options;

	add_header Cache-Control "no-store" always;
	add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header Cross-Origin-Resource-Policy "same-site" always;
	add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
}
