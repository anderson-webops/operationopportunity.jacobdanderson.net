# Include inside the TLS server block for operationopportunity.jacobdanderson.net.
location = /api {
	return 404;
}

# Diagnostics are loopback-only even when the API-side key gate is enabled.
location = /api/_dbinfo {
	return 404;
}

location ^~ /api/ {
	client_max_body_size 64k;
	proxy_http_version 1.1;
	proxy_pass http://127.0.0.1:3002/;
	proxy_connect_timeout 3s;
	proxy_send_timeout 15s;
	proxy_read_timeout 15s;
	proxy_next_upstream off;

	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Internal-Diagnostics-Key "";
	proxy_set_header Connection "";
	proxy_hide_header Server;

	add_header Cache-Control "no-store" always;
	add_header X-Content-Type-Options "nosniff" always;
}
